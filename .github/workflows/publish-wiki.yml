name: Publish wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-yammu-wiki
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Zergie/YAMMU-docs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Publish filtered documentation to the wiki
        shell: bash
        run: |
          set -euo pipefail
          docs_url='https://github.com/Zergie/YAMMU-docs.git'
          wiki_url='https://github.com/Zergie/YAMMU.wiki.git'
          docs_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$docs_auth"
          docs_git() {
            git -c "http.${docs_url}.extraheader=AUTHORIZATION: basic $docs_auth" "$@"
          }

          # Read latest main so a delayed run cannot publish an obsolete snapshot.
          docs_git clone --branch main --single-branch "$docs_url" "$RUNNER_TEMP/yammu-docs"
          cd "$RUNNER_TEMP/yammu-docs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add wiki "$wiki_url"
          git fetch wiki refs/heads/master:refs/remotes/wiki/master

          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Add the WIKI_TOKEN Actions secret, then run this workflow again."
            exit 1
          fi

          wiki_commit="$(python3 .github/scripts/prepare-wiki.py)"
          wiki_auth="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w0)"
          echo "::add-mask::$wiki_auth"
          git -c "http.${wiki_url}.extraheader=AUTHORIZATION: basic $wiki_auth" \
            push wiki "$wiki_commit:refs/heads/master"
          echo "Wiki commit: $wiki_commit; source: $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
